{# Arguments: tabs (list of status, label, count), status (the open tab). Redrawn by the reply actions in api.py. #}
<nav id="inbox-tabs" class="tabs" aria-label="Reply status">
  {% for value, label, count in tabs %}
    <a
      href="?status={{ value }}"
      class="tabs__link{% if value == status %} tabs__link--active{% elif not count %} tabs__link--empty{% endif %}"
      {% if value == status %}aria-current="page"{% endif %}
    >{{ label }} <span class="tabs__count">{{ count }}</span></a>
  {% endfor %}
</nav>
