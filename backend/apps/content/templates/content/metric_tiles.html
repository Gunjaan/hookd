{% load content_ui %}{# Arguments: metrics (list of Metric or metric dicts), inline (optional: one row of numbers without tiles). #}
<dl class="metrics{% if inline %} metrics--inline{% endif %}">
  {% for metric in metrics %}
    <div class="metrics__tile">
      <dt class="metrics__label">{{ metric.label }}</dt>
      <dd class="metrics__value">{{ metric|metric_display }}</dd>
    </div>
  {% endfor %}
</dl>
