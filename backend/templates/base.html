{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% with site=request.scheme|add:"://"|add:request.get_host %}
    <meta name="description" content="Hookd is an AI social media manager for sellers and creators. It replies to every Instagram comment in your voice and your buyer's language, 24/7." />
    <meta name="robots" content="{% block robots %}index, follow{% endblock %}" />
    <link rel="canonical" href="{{ site }}{{ request.path }}" />
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hookd" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="{{ site }}{{ request.path }}" />
    <meta property="og:title" content="Hookd: your very own agent to get the world hookd" />
    <meta property="og:description" content="An AI social media manager that replies to every Instagram comment in your voice and your buyer's language, 24/7." />
    <meta property="og:image" content="{{ site }}{% static 'img/og-image.png' %}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hookd: your very own agent to get the world hookd." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hookd: your very own agent to get the world hookd" />
    <meta name="twitter:description" content="An AI social media manager that replies to every Instagram comment in your voice and your buyer's language, 24/7." />
    <meta name="twitter:image" content="{{ site }}{% static 'img/og-image.png' %}" />
    <meta name="twitter:image:alt" content="Hookd: your very own agent to get the world hookd." />
    {% endwith %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/components.css' %}" />
    <link rel="stylesheet" href="{% static 'css/pages.css' %}" />
    {% block head %}{% endblock %}
    <script src="{% static 'js/app.js' %}" defer></script>
    <title>{% block title %}{% endblock %} | Hookd</title>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
