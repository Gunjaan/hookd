{# Arguments: field (a bound BooleanField), switch (optional: draw it as an on or off switch). #}
{% with message_id=field.auto_id|add:"-message" %}
  <div class="field">
    <label class="checkbox{% if switch %} checkbox--switch{% endif %}">
      <input
        id="{{ field.auto_id }}"
        name="{{ field.html_name }}"
        type="checkbox"
        {% if switch %}role="switch"{% endif %}
        {% if field.value %}checked{% endif %}
        {% if field.help_text %}aria-describedby="{{ message_id }}"{% endif %}
      />
      <span>{{ field.label }}</span>
    </label>
    {% if field.help_text %}<p id="{{ message_id }}" class="field__message{% if switch %} field__message--switch{% endif %}">{{ field.help_text }}</p>{% endif %}
  </div>
{% endwith %}
