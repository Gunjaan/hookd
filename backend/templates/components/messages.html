{# Django messages as alerts. MESSAGE_TAGS maps levels to alert tones (error -> danger). #}
{% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert alert--{{ message.level_tag }}" role="{% if message.level_tag == 'danger' %}alert{% else %}status{% endif %}">
        <div class="alert__body">{{ message }}</div>
      </div>
    {% endfor %}
  </div>
{% endif %}
