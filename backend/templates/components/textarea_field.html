{# Arguments: field (a bound form field with a Textarea widget). #}
{% with widget=field.field.widget message_id=field.auto_id|add:"-message" %}
  <div class="field">
    <label for="{{ field.auto_id }}" class="field__label">{{ field.label }}</label>
    <textarea
      id="{{ field.auto_id }}"
      name="{{ field.html_name }}"
      rows="{{ widget.attrs.rows|default:4 }}"
      {% if field.field.max_length %}maxlength="{{ field.field.max_length }}"{% endif %}
      {% if widget.attrs.placeholder %}placeholder="{{ widget.attrs.placeholder }}"{% endif %}
      {% if field.field.required %}required{% endif %}
      {% if field.errors %}aria-invalid="true"{% endif %}
      {% if field.errors or field.help_text %}aria-describedby="{{ message_id }}"{% endif %}
      class="field__input field__input--textarea{% if field.errors %} field__input--error{% endif %}"
    >{{ field.value|default:"" }}</textarea>
    {% if field.errors %}
      <p id="{{ message_id }}" class="field__message field__message--error">{{ field.errors.0 }}</p>
    {% elif field.help_text %}
      <p id="{{ message_id }}" class="field__message">{{ field.help_text }}</p>
    {% endif %}
  </div>
{% endwith %}
